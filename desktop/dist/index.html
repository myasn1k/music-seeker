<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >
  <title>MusicSeeker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #121212;
      color: #fff;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: #1e1e1e;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    p {
      margin: 0 0 24px;
      color: #aaa;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #444;
      border-radius: 10px;
      background: #121212;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #b6f000;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #b6f000;
      color: #111;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .error {
      min-height: 20px;
      margin-top: 12px;
      color: #ff7070;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>MusicSeeker</h1>

    <p>
      Enter the address of your MusicSeeker server.
      It will be remembered on this device.
    </p>

    <form id="server-form">
      <label for="server-url">Server URL</label>

      <input
        id="server-url"
        type="url"
        placeholder="https://music.example.com"
        autocomplete="url"
        required
      >

      <button type="submit">Connect</button>

      <div class="error" id="error"></div>
    </form>
  </div>

  <script>
    const STORAGE_KEY = "musicseeker_server_url";
    const APP_VERSION = "__APP_VERSION__";

    const form = document.getElementById("server-form");
    const input = document.getElementById("server-url");
    const error = document.getElementById("error");

    function normalizeServerUrl(value) {
      value = value.trim().replace(/\/+$/, "");

      if (!/^https?:\/\//i.test(value)) {
        value = "http://" + value;
      }

      const url = new URL(value);

      if (url.protocol !== "http:" && url.protocol !== "https:") {
        throw new Error("Only HTTP and HTTPS URLs are supported.");
      }

      return url;
    }

    function openServer(value) {
      const url = normalizeServerUrl(value);

      url.searchParams.set("app_version", APP_VERSION);

      window.location.replace(url.toString());
    }

    const params = new URLSearchParams(window.location.search);

    if (params.get("reset_server") === "1") {
      localStorage.removeItem(STORAGE_KEY);
      history.replaceState(null, "", window.location.pathname);
    }

    const savedServer = localStorage.getItem(STORAGE_KEY);

    if (savedServer) {
      try {
        openServer(savedServer);
      } catch (_) {
        localStorage.removeItem(STORAGE_KEY);
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      error.textContent = "";

      try {
        const url = normalizeServerUrl(input.value);

        localStorage.setItem(
          STORAGE_KEY,
          url.origin + url.pathname.replace(/\/+$/, "")
        );

        openServer(url.toString());
      } catch (e) {
        error.textContent = e.message || "Invalid server URL.";
      }
    });
  </script>
</body>
</html>
